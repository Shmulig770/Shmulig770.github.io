<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Pop</title>
<style>
  :root { --bg: #f4ecff; --card: #ffffff; --ink: #2b1748; --muted: #6d5a85; --accent: #7b2cbf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1a1027; --card: #261838; --ink: #f1e9ff; --muted: #b9a7d1; --accent: #c77dff; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 4px 16px rgba(60, 20, 110, .2); }
  h1 { color: var(--accent); margin: 18px 0 4px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Star Pop icon">
  <h1>Star Pop</h1>
  <p>Find the star hidden in the balloons. A puzzle game with endless levels.</p>
  <p><a href="privacy.html">Privacy policy</a> · <a href="mailto:slevelgames@gmail.com">Contact</a></p>
  <p style="opacity:.6">© S Level Games</p>
</main>
</body>
</html>
